name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.npm_publish_state.outputs.already_published }}
      dist_tag: ${{ steps.npm_publish_state.outputs.dist_tag }}
      publish_tag: ${{ steps.npm_publish_state.outputs.publish_tag }}
      package_name: ${{ steps.npm_publish_state.outputs.package_name }}
      package_version: ${{ steps.npm_publish_state.outputs.package_version }}
      package_file: ${{ steps.pack.outputs.package_file }}
      package_sha256: ${{ steps.pack.outputs.package_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release commit to equal origin main
        run: |
          git fetch origin main --no-tags
          RELEASE_COMMIT=$(git rev-parse HEAD)
          MAIN_COMMIT=$(git rev-parse origin/main)
          if [ "$RELEASE_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "::error::The release commit must equal origin/main exactly"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run supply-chain IOC scan
        run: npm run security:ioc-scan

      - name: Verify OpenCode package payload
        run: node tests/scripts/build-opencode.test.js

      - name: Validate version tag
        run: |
          if ! [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag format. Expected vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi

        env:
          REF_NAME: ${{ github.ref_name }}
      - name: Verify package version matches tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            echo "Run: ./scripts/release.sh $TAG_VERSION"
            exit 1
          fi

      - name: Verify release metadata stays in sync
        run: node tests/plugin-manifest.test.js

      # Upstream queried the npm registry here to decide whether this version was
      # already published. This fork publishes nothing, so the lookup is pointless
      # and actively risky: the name `communityhelp` may exist on npm owned by
      # someone else, and a hit would be read as "already published". Metadata is
      # now read locally.
      - name: Read release metadata
        id: npm_publish_state
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "already_published=false" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Use reviewed release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_NOTES="docs/releases/${RELEASE_VERSION}/release-notes.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
            echo "::error::Missing reviewed release notes for ${RELEASE_VERSION}: ${RELEASE_NOTES}"
            exit 1
          fi
          cp "$RELEASE_NOTES" release_body.md

      - name: Pack npm artifact
        id: pack
        run: |
          npm pack --json > npm-pack.json
          node -e "const crypto = require('crypto'); const fs = require('fs'); const data = JSON.parse(fs.readFileSync('npm-pack.json', 'utf8')); const entries = Array.isArray(data) ? data : [data]; const pkg = require('./package.json'); const expected = pkg.name.replace(/^@/, '').replace(/\//g, '-') + '-' + pkg.version + '.tgz'; const file = entries.find(entry => entry?.filename === expected)?.filename; if (!file) throw new Error('Packed filename did not match ' + expected); const archives = fs.readdirSync('.').filter(name => name.endsWith('.tgz')); if (archives.length !== 1 || archives[0] !== file) throw new Error('Expected exactly one packed archive'); const digest = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'package_file=' + file + '\npackage_sha256=' + digest + '\n')"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecc-release-artifacts
          path: |
            release_body.md
            ${{ steps.pack.outputs.package_file }}
            tests/ci/packed-artifact-lifecycle.js
          if-no-files-found: error


  lifecycle:
    name: Packed Lifecycle (${{ matrix.os }})
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'

      - name: Download exact packed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecc-release-artifacts
          path: release-artifacts

      - name: Verify packed install lifecycle
        env:
          ECC_RELEASE_PACKAGE: release-artifacts/${{ needs.verify.outputs.package_file }}
          ECC_RELEASE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
          # The runner script executes from INSIDE the downloaded artifact, where
          # there is no package.json to read the name from. Passed explicitly.
          ECC_RELEASE_PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
        run: node release-artifacts/tests/ci/packed-artifact-lifecycle.js

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [verify, lifecycle]
    permissions:
      contents: write

    # CommunityHelp is NOT published to npm, so every npm step upstream had here
    # is removed rather than left to fail: publish, registry verification, and
    # dist-tag promotion all required a registry token this fork does not have, and
    # the artifact check hardcoded upstream's `ecc-universal-*.tgz` filename.
    # A tag now produces a GitHub Release and nothing else, which is the whole
    # distribution surface for a Claude Code plugin.
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecc-release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release_body.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
